bio: |
  
  I am a postdoctoral researcher specializing in distributed and networked systems with a focus on In-Network and Edge/Fog/Cloud computing, IoT, and systems for distributed AI. 
  My work addresses the challenges of orchestrating and scheduling AI and microservice applications across geographically distributed infrastructures under constraints of latency, energy, and resource availability. 
  I combine analytical modeling, optimization, and heuristic algorithms with experimental validation on realistic platforms.

